<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | E-Commerce Admin Dashboard</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

    <aside class="sidebar">
        <div class="logo">
            <div class="logo-icon">E</div>
            <div>
                <h2>ECOM</h2>
                <span>Dashboard</span>
            </div>
        </div>

        <nav>
            <a href="index.html">Dashboard</a>
            <a href="products.html">Products</a>
            <a href="cart.html">Cart</a>
            <a href="checkout.html" class="active">Checkout</a>
        </nav>
    </aside>

    <main class="main-content">

        <header class="topbar">
            <div>
                <h1>Checkout</h1>
                <p>Complete your order</p>
            </div>

            <a href="cart.html" class="cart-btn">← Back to Cart</a>
        </header>

        <section class="checkout-container">

            <div class="checkout-form">

                <div class="card">
                    <h2>Billing Information</h2>

                    <div class="form-row">
                        <div class="form-group">
                            <label>First Name</label>
                            <input type="text" id="firstName" placeholder="Enter first name">
                        </div>

                        <div class="form-group">
                            <label>Last Name</label>
                            <input type="text" id="lastName" placeholder="Enter last name">
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Email Address</label>
                        <input type="email" id="email" placeholder="Enter email address">
                    </div>

                    <div class="form-group">
                        <label>Phone Number</label>
                        <input type="tel" id="phone" placeholder="Enter phone number">
                    </div>

                    <div class="form-group">
                        <label>Address</label>
                        <input type="text" id="address" placeholder="Enter complete address">
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>City</label>
                            <input type="text" id="city" placeholder="Enter city">
                        </div>

                        <div class="form-group">
                            <label>Postal Code</label>
                            <input type="text" id="postalCode" placeholder="Postal code">
                        </div>
                    </div>
                </div>

                <div class="card">
                    <h2>Payment Method</h2>

                    <label class="payment-option">
                        <input type="radio" name="payment" value="Cash on Delivery" checked>
                        <span>Cash on Delivery</span>
                    </label>

                    <label class="payment-option">
                        <input type="radio" name="payment" value="Credit/Debit Card">
                        <span>Credit / Debit Card</span>
                    </label>
                </div>

            </div>

            <div class="order-summary card">
                <h2>Order Summary</h2>

                <div id="checkoutItems"></div>

                <div class="summary-line">
                    <span>Subtotal</span>
                    <span id="checkoutSubtotal">$0.00</span>
                </div>

                <div class="summary-line">
                    <span>Shipping</span>
                    <span>$10.00</span>
                </div>

                <hr>

                <div class="summary-total">
                    <span>Total</span>
                    <strong id="checkoutTotal">$10.00</strong>
                </div>

                <button class="place-order-btn" onclick="placeOrder()">
                    Place Order
                </button>
            </div>

        </section>

    </main>

    <script src="script.js"></script>

    <script>
        function loadCheckout() {

            const cart = JSON.parse(localStorage.getItem("cart")) || [];

            const checkoutItems = document.getElementById("checkoutItems");
            const subtotalElement = document.getElementById("checkoutSubtotal");
            const totalElement = document.getElementById("checkoutTotal");

            let subtotal = 0;

            checkoutItems.innerHTML = "";

            if (cart.length === 0) {
                checkoutItems.innerHTML =
                    "<p>Your cart is empty.</p>";

                subtotalElement.textContent = "$0.00";
                totalElement.textContent = "$0.00";

                return;
            }

            cart.forEach(item => {

                const itemTotal = item.price * item.quantity;
                subtotal += itemTotal;

                checkoutItems.innerHTML += `
                    <div class="checkout-item">
                        <div>
                            <strong>${item.name}</strong>
                            <p>Quantity: ${item.quantity}</p>
                        </div>

                        <span>$${itemTotal.toFixed(2)}</span>
                    </div>
                `;
            });

            const shipping = 10;
            const total = subtotal + shipping;

            subtotalElement.textContent =
                "$" + subtotal.toFixed(2);

            totalElement.textContent =
                "$" + total.toFixed(2);
        }

        function placeOrder() {

            const firstName =
                document.getElementById("firstName").value.trim();

            const lastName =
                document.getElementById("lastName").value.trim();

            const email =
                document.getElementById("email").value.trim();

            const phone =
                document.getElementById("phone").value.trim();

            const address =
                document.getElementById("address").value.trim();

            const city =
                document.getElementById("city").value.trim();

            if (
                !firstName ||
                !lastName ||
                !email ||
                !phone ||
                !address ||
                !city
            ) {
                alert("Please fill in all required information.");
                return;
            }

            const cart =
                JSON.parse(localStorage.getItem("cart")) || [];

            if (cart.length === 0) {
                alert("Your cart is empty.");
                return;
            }

            localStorage.setItem(
                "customerName",
                firstName + " " + lastName
            );

            localStorage.removeItem("cart");

            window.location.href = "confirmation.html";
        }

        loadCheckout();
    </script>

</body>
</html>
