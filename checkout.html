<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | Shopora</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="navbar">
    <div class="nav-container">
        <a href="index.html" class="logo">
            <span class="logo-mark">S</span>
            <span>Shopora</span>
        </a>

        <nav class="nav-links checkout-nav">
            <a href="products.html">Continue Shopping</a>
            <a href="cart.html">Cart</a>
        </nav>
    </div>
</header>

<main>

<section class="page-header">
    <p class="eyebrow">SECURE CHECKOUT</p>
    <h1>Complete Your Order</h1>
    <p>Enter your information to place your order.</p>
</section>

<section class="checkout-layout section">

    <form class="checkout-form" id="checkout-form">

        <div class="form-card">
            <h2>Customer Information</h2>

            <div class="form-grid">
                <div class="form-group full">
                    <label for="name">Customer Name</label>
                    <input type="text" id="name" required placeholder="Enter your full name">
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" required placeholder="you@example.com">
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" required placeholder="+92 300 1234567">
                </div>

                <div class="form-group full">
                    <label for="address">Address</label>
                    <input type="text" id="address" required placeholder="House, Street, Area">
                </div>

                <div class="form-group">
                    <label for="city">City</label>
                    <input type="text" id="city" required placeholder="Your city">
                </div>

                <div class="form-group">
                    <label for="postal">Postal Code</label>
                    <input type="text" id="postal" required placeholder="Postal code">
                </div>
            </div>
        </div>

        <div class="form-card">
            <h2>Payment Method</h2>

            <label class="payment-option">
                <input type="radio" name="payment" value="Cash on Delivery" checked>
                <span>
                    <strong>Cash on Delivery</strong>
                    <small>Pay when your order arrives.</small>
                </span>
            </label>

            <label class="payment-option">
                <input type="radio" name="payment" value="Bank Transfer">
                <span>
                    <strong>Bank Transfer</strong>
                    <small>Payment through bank transfer.</small>
                </span>
            </label>
        </div>

        <button type="submit" class="btn btn-primary checkout-btn">
            Place Order
        </button>

    </form>

    <aside class="order-summary" id="checkout-summary"></aside>

</section>

</main>

<footer class="footer">
    <div class="footer-bottom">
        <p>© 2026 Shopora. All rights reserved.</p>
    </div>
</footer>

<script src="js/script.js"></script>
</body>
</html>
