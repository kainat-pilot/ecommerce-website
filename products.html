<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Products - ShopEase</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Navigation Bar -->
    <header class="navbar">

        <div class="logo">
            ShopEase
        </div>

        <nav>
            <a href="index.html">Home</a>
            <a href="products.html">Products</a>
            <a href="cart.html">
                Cart <span id="cart-count">0</span>
            </a>
        </nav>

        <div class="search-box">
            <input
                type="text"
                id="product-search"
                placeholder="Search products..."
            >

            <button onclick="applyFilters()">
                Search
            </button>
        </div>

    </header>


    <!-- Products Page -->
    <main>

        <section class="section">

            <div class="section-title">
                <h1>All Products</h1>
                <p>Explore our complete collection</p>
            </div>


            <!-- Filters -->
            <div class="filters">

                <div class="filter-item">

                    <label for="category-filter">
                        Category
                    </label>

                    <select id="category-filter">
                        <option value="all">
                            All Categories
                        </option>

                        <option value="Electronics">
                            Electronics
                        </option>

                        <option value="Fashion">
                            Fashion
                        </option>

                        <option value="Shoes">
                            Shoes
                        </option>

                        <option value="Accessories">
                            Accessories
                        </option>

                        <option value="Home & Living">
                            Home & Living
                        </option>
                    </select>

                </div>


                <div class="filter-item">

                    <label for="price-filter">
                        Price
                    </label>

                    <select id="price-filter">

                        <option value="all">
                            All Prices
                        </option>

                        <option value="0-2000">
                            Under Rs. 2,000
                        </option>

                        <option value="2000-4000">
                            Rs. 2,000 - 4,000
                        </option>

                        <option value="4000-6000">
                            Rs. 4,000 - 6,000
                        </option>

                        <option value="6000-10000">
                            Above Rs. 6,000
                        </option>

                    </select>

                </div>


                <div class="filter-item">

                    <label for="sort-filter">
                        Sort By
                    </label>

                    <select id="sort-filter">

                        <option value="default">
                            Default
                        </option>

                        <option value="low-high">
                            Price: Low → High
                        </option>

                        <option value="high-low">
                            Price: High → Low
                        </option>

                    </select>

                </div>


                <button
                    class="filter-button"
                    onclick="applyFilters()"
                >
                    Apply Filters
                </button>

            </div>


            <!-- Products -->
            <div
                id="products-container"
                class="product-grid"
            >
                <!-- Products will be displayed by JavaScript -->
            </div>

        </section>

    </main>


    <!-- Footer -->
    <footer class="footer">

        <div class="footer-content">

            <div>
                <h3>ShopEase</h3>

                <p>
                    Your modern online shopping destination.
                </p>
            </div>


            <div>

                <h3>Quick Links</h3>

                <a href="index.html">
                    Home
                </a>

                <a href="products.html">
                    Products
                </a>

                <a href="cart.html">
                    Cart
                </a>

            </div>


            <div>

                <h3>Contact</h3>

                <p>
                    Email: support@shopease.com
                </p>

                <p>
                    Phone: +92 300 1234567
                </p>

            </div>

        </div>


        <div class="footer-bottom">

            <p>
                © 2026 ShopEase. All Rights Reserved.
            </p>

        </div>

    </footer>


    <!-- JavaScript -->
    <script src="script.js"></script>

</body>
</html>
